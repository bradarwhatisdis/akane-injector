name: Build akane-injector (android12-5.10)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'module/**'
      - 'injector/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/build-android12-5.10.yml'

env:
  KERNELS: "android12-5.10"
  ABI: "arm64-v8a"

jobs:
  build:
    name: Build android12-5.10
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git wget unzip

      - name: Install Android NDK r26
        run: |
          NDK_VERSION="26.3.11579264"
          NDK_DIR="${{ runner.workspace }}/ndk/android-ndk-r26d"
          mkdir -p "${{ runner.workspace }}/ndk"
          wget -q "https://dl.google.com/android/repository/android-ndk-r26d-linux.zip" -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d "${{ runner.workspace }}/ndk"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> $GITHUB_ENV
          echo "${NDK_DIR}" >> $GITHUB_PATH

      - name: Build kernel module (android12-5.10)
        run: |
          make module KERNELS="android12-5.10"
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled

      - name: Build injector
        run: |
          make injector ABI="${{ env.ABI }}"
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_HOME: ${{ runner.workspace }}/android-sdk

      - name: Verify artifacts
        run: |
          ls -la out/injector/libs/${{ env.ABI }}/
          file out/injector/libs/${{ env.ABI }}/akane-injector
          file out/injector/libs/${{ env.ABI }}/libakane-runtime.so

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: akane-injector-android12-5.10-${{ env.ABI }}
          path: |
            out/injector/libs/${{ env.ABI }}/akane-injector
            out/injector/libs/${{ env.ABI }}/libakane-runtime.so
          retention-days: 30

      - name: Upload kernel module
        uses: actions/upload-artifact@v4
        with:
          name: akane-ko-android12-5.10
          path: out/module/android12-5.10/akane.ko
          retention-days: 30

  release:
    name: Create Release (on tag)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/akane-injector-android12-5.10-arm64-v8a/akane-injector
            artifacts/akane-injector-android12-5.10-arm64-v8a/libakane-runtime.so
            artifacts/akane-ko-android12-5.10/akane.ko
          generate_release_notes: true